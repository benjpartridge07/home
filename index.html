<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Home</title>
<style>
  :root{
    --bg:#f5f6f8;
    --card:#ffffff;
    --border:#e2e4e9;
    --text:#1b1e24;
    --text-dim:#5b616e;
    --eric:#2f6fed;
    --eric-soft:#eaf0fe;
    --alice:#0e9488;
    --alice-soft:#e3f7f4;
    --ttrpg:#d6336c;
    --ttrpg-soft:#fbe4ec;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  header{
    padding:3rem 1.5rem 1rem;
    max-width:700px;
    margin:0 auto;
    text-align:center;
  }
  header h1{
    margin:0 0 .4rem;
    font-size:2.1rem;
  }
  header p{
    margin:0;
    color:var(--text-dim);
    font-size:1.05rem;
  }
  main{
    max-width:700px;
    margin:0 auto;
    padding:2rem 1.5rem 3rem;
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:1.25rem;
  }
  @media (max-width:520px){
    main{ grid-template-columns:1fr; }
  }
  .person-card{
    display:block;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:2rem 1.5rem;
    text-align:center;
    text-decoration:none;
    color:var(--text);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .person-card:hover{
    transform:translateY(-3px);
    box-shadow:0 8px 20px rgba(20,22,26,.08);
  }
  .person-card .icon{
    width:56px;
    height:56px;
    border-radius:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.6rem;
    margin:0 auto 1rem;
  }
  .person-card.eric .icon{ background:var(--eric-soft); }
  .person-card.alice .icon{ background:var(--alice-soft); }
  .person-card.ttrpg .icon{ background:var(--ttrpg-soft); }
  .person-card h2{
    margin:0 0 .4rem;
    font-size:1.25rem;
  }
  .person-card p{
    margin:0;
    color:var(--text-dim);
    font-size:.9rem;
    line-height:1.5;
  }
</style>
</head>
<body>

<header>
  <h1>Home</h1>
  <p>Pick a project to see what's inside.</p>
</header>

<main>

  <a class="person-card eric" href="eric-school/index.html">
    <div class="icon">🎓</div>
    <h2>Eric School</h2>
    <p>GCSE revision materials.</p>
  </a>

  <a class="person-card alice" href="alice-school/index.html">
    <div class="icon">🎓</div>
    <h2>Alice School</h2>
    <p>Nothing here yet.</p>
  </a>

  <a class="person-card ttrpg" href="ttrpg/index.html">
    <div class="icon">🎲</div>
    <h2>TTRPG</h2>
    <p>Tabletop RPG notes &amp; campaigns.</p>
  </a>

</main>

</body>
</html>
