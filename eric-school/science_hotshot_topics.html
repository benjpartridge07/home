<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Choose Your Topics — Science Hotshot</title>
<style>
  :root{
    --bg:#f5f6f8;
    --card:#ffffff;
    --border:#e2e4e9;
    --text:#1b1e24;
    --text-dim:#5b616e;
    --accent:#b45309;
    --accent-soft:#fdf0e1;
    --bio:#2f9d5c;
    --bio-soft:#e7f8ee;
    --chem:#c4571f;
    --chem-soft:#fbeee4;
    --phys:#2f6fed;
    --phys-soft:#eaf0fe;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  header{
    padding:2.5rem 1.5rem 1.5rem;
    max-width:700px;
    margin:0 auto;
  }
  .back-link{
    display:inline-flex;
    align-items:center;
    gap:.3rem;
    color:var(--text-dim);
    text-decoration:none;
    font-size:.9rem;
    margin-bottom:.75rem;
  }
  .back-link:hover{ color:var(--accent); }
  header h1{
    margin:0 0 .25rem;
    font-size:1.9rem;
  }
  header p{
    margin:0;
    color:var(--text-dim);
    font-size:1rem;
  }
  main{
    max-width:700px;
    margin:0 auto;
    padding:0 1.5rem 6rem;
  }

  .subject-section{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:1.5rem 1.5rem 1.25rem;
    margin-bottom:1.25rem;
  }
  .subject-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:.5rem;
    margin-bottom:1rem;
  }
  .subject-title{
    display:flex;
    align-items:center;
    gap:.5rem;
    font-size:1.15rem;
    font-weight:700;
  }
  .subject-section.bio .subject-title{ color:var(--bio); }
  .subject-section.chem .subject-title{ color:var(--chem); }
  .subject-section.phys .subject-title{ color:var(--phys); }
  .subject-actions{
    display:flex;
    gap:.6rem;
  }
  .subject-actions button{
    font-family:inherit;
    font-size:.78rem;
    font-weight:600;
    background:none;
    border:none;
    color:var(--text-dim);
    text-decoration:underline;
    cursor:pointer;
    padding:0;
  }
  .subject-actions button:hover{ color:var(--accent); }

  .topic-row{
    display:flex;
    align-items:flex-start;
    gap:.7rem;
    padding:.6rem 0;
    border-top:1px solid var(--border);
  }
  .topic-row:first-of-type{ border-top:none; }
  .topic-row input[type="checkbox"]{
    width:19px;
    height:19px;
    margin-top:.15rem;
    flex-shrink:0;
    accent-color:var(--accent);
  }
  .topic-row label{
    flex:1;
    font-size:.95rem;
    line-height:1.4;
    cursor:pointer;
  }
  .topic-row.upcoming{
    opacity:.55;
  }
  .topic-row.upcoming label{
    cursor:default;
  }
  .topic-tag{
    display:inline-block;
    font-size:.72rem;
    font-weight:600;
    padding:.15rem .5rem;
    border-radius:999px;
    background:var(--border);
    color:var(--text-dim);
    margin-left:.5rem;
    vertical-align:middle;
  }

  .subject-count{
    font-size:.85rem;
    color:var(--text-dim);
    font-weight:600;
  }

  .sticky-bar{
    position:sticky;
    bottom:0;
    background:var(--bg);
    border-top:1px solid var(--border);
    padding:1rem 1.5rem calc(1rem + env(safe-area-inset-bottom));
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:1rem;
    flex-wrap:wrap;
  }
  .sticky-bar .summary{
    font-size:.9rem;
    color:var(--text-dim);
  }
  .sticky-bar .summary strong{ color:var(--text); }
  .start-btn{
    display:inline-block;
    background:var(--accent);
    color:#fff;
    text-decoration:none;
    font-weight:700;
    padding:.85rem 1.5rem;
    border-radius:10px;
    white-space:nowrap;
  }
  .start-btn:hover{ background:#93450a; }
</style>
</head>
<body>

<header>
  <a class="back-link" href="school/science/index.html">&larr; All subjects</a>
  <h1>🎯 Choose Your Topics</h1>
  <p>Tick the topics you've actually revised &mdash; Science Hotshot will only ask questions from those. Greyed-out topics don't have questions yet.</p>
</header>

<main id="subjects"></main>

<div class="sticky-bar">
  <div class="summary" id="summary">Loading&hellip;</div>
  <a class="start-btn" href="science_hotshot.html">Start Hotshot &rarr;</a>
</div>

<script src="science_hotshot_data.js"></script>
<script>
  const TOPICS_KEY = "eric_science_hotshot_topics";
  const SUBJECT_INFO = {
    bio: { label: "🧬 Biology", cls: "bio" },
    chem: { label: "⚗️ Chemistry", cls: "chem" },
    phys: { label: "🌀 Physics", cls: "phys" },
  };

  function loadSelection() {
    try {
      return JSON.parse(localStorage.getItem(TOPICS_KEY)) || {};
    } catch {
      return {};
    }
  }

  function saveSelection(sel) {
    localStorage.setItem(TOPICS_KEY, JSON.stringify(sel));
  }

  // A "done" topic counts as ticked unless explicitly set to false — so it
  // matches the default-all-included behaviour on the Hotshot page.
  function isChecked(sel, topic) {
    return topic.status === "done" && sel[topic.id] !== false;
  }

  const selection = loadSelection();
  const subjectsEl = document.getElementById("subjects");
  const summaryEl = document.getElementById("summary");

  function questionCount(topicId) {
    return SCIENCE_QUESTIONS.filter(q => q.t === topicId).length;
  }

  function renderSummary() {
    const sel = loadSelection();
    const doneTopics = SCIENCE_TOPICS.filter(t => t.status === "done");
    const checkedTopics = doneTopics.filter(t => isChecked(sel, t));
    const totalQuestions = checkedTopics.reduce((sum, t) => sum + questionCount(t.id), 0);
    summaryEl.innerHTML = `<strong>${checkedTopics.length}</strong> of <strong>${doneTopics.length}</strong> topics selected &middot; <strong>${totalQuestions}</strong> questions available`;
  }

  Object.keys(SUBJECT_INFO).forEach(subjectKey => {
    const info = SUBJECT_INFO[subjectKey];
    const topics = SCIENCE_TOPICS.filter(t => t.subject === subjectKey);

    const section = document.createElement("div");
    section.className = `subject-section ${info.cls}`;

    const head = document.createElement("div");
    head.className = "subject-head";
    head.innerHTML = `
      <span class="subject-title">${info.label}</span>
      <div class="subject-actions">
        <button type="button" data-action="all">Select all</button>
        <button type="button" data-action="none">Select none</button>
      </div>
    `;
    section.appendChild(head);

    topics.forEach(topic => {
      const row = document.createElement("div");
      row.className = "topic-row" + (topic.status === "upcoming" ? " upcoming" : "");

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.id = `topic-${topic.id}`;
      if (topic.status === "upcoming") {
        checkbox.disabled = true;
      } else {
        checkbox.checked = isChecked(selection, topic);
        checkbox.addEventListener("change", () => {
          const sel = loadSelection();
          sel[topic.id] = checkbox.checked;
          saveSelection(sel);
          renderSummary();
        });
      }

      const label = document.createElement("label");
      label.htmlFor = `topic-${topic.id}`;
      const count = topic.status === "done" ? questionCount(topic.id) : 0;
      label.innerHTML = topic.status === "upcoming"
        ? `${topic.label} <span class="topic-tag">Not built yet</span>`
        : `${topic.label} <span class="topic-tag">${count} question${count === 1 ? "" : "s"}</span>`;

      row.appendChild(checkbox);
      row.appendChild(label);
      section.appendChild(row);
    });

    head.querySelector('[data-action="all"]').addEventListener("click", () => {
      const sel = loadSelection();
      topics.filter(t => t.status === "done").forEach(t => { sel[t.id] = true; });
      saveSelection(sel);
      topics.filter(t => t.status === "done").forEach(t => {
        document.getElementById(`topic-${t.id}`).checked = true;
      });
      renderSummary();
    });

    head.querySelector('[data-action="none"]').addEventListener("click", () => {
      const sel = loadSelection();
      topics.filter(t => t.status === "done").forEach(t => { sel[t.id] = false; });
      saveSelection(sel);
      topics.filter(t => t.status === "done").forEach(t => {
        document.getElementById(`topic-${t.id}`).checked = false;
      });
      renderSummary();
    });

    subjectsEl.appendChild(section);
  });

  renderSummary();
</script>

</body>
</html>
