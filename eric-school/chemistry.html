<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Eric's Chemistry Revision</title>
<style>
  :root{
    --bg:#f5f6f8;
    --card:#ffffff;
    --border:#e2e4e9;
    --text:#1b1e24;
    --text-dim:#5b616e;
    --accent:#c4571f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  header{
    padding:2.5rem 1.5rem 1.5rem;
    max-width:900px;
    margin:0 auto;
  }
  .back-link{
    display:inline-flex;
    align-items:center;
    gap:.3rem;
    color:var(--text-dim);
    text-decoration:none;
    font-size:.9rem;
    margin-bottom:.75rem;
  }
  .back-link:hover{ color:var(--accent); }
  header h1{
    margin:0 0 .25rem;
    font-size:1.9rem;
  }
  header p{
    margin:0;
    color:var(--text-dim);
    font-size:1rem;
  }
  main{
    max-width:900px;
    margin:0 auto;
    padding:0 1.5rem 3rem;
  }
  .empty-state{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:2.5rem 1.5rem;
    text-align:center;
    color:var(--text-dim);
    margin-top:1.5rem;
  }
  .empty-state .icon{ font-size:2rem; margin-bottom:.75rem; }
</style>
</head>
<body>

<header>
  <a class="back-link" href="school/science/index.html">&larr; All subjects</a>
  <h1>Eric's Chemistry Revision</h1>
  <p>AQA Combined Science: Synergy (8465), Foundation tier.</p>
</header>

<main>
  <div class="empty-state">
    <div class="icon">⚗️</div>
    <p>No chemistry topics built yet &mdash; check back soon.</p>
  </div>
</main>

</body>
</html>
