<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Science Hotshot</title>
<style>
  :root{
    --bg:#f5f6f8;
    --card:#ffffff;
    --border:#e2e4e9;
    --text:#1b1e24;
    --text-dim:#5b616e;
    --accent:#b45309;
    --accent-soft:#fdf0e1;
    --bio:#2f9d5c;
    --bio-soft:#e7f8ee;
    --chem:#c4571f;
    --chem-soft:#fbeee4;
    --phys:#2f6fed;
    --phys-soft:#eaf0fe;
    --right:#1f9d55;
    --right-soft:#e7f8ee;
    --wrong:#d1453b;
    --wrong-soft:#fbe9e8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family: -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  header{
    padding:2.5rem 1.5rem 1.5rem;
    max-width:700px;
    margin:0 auto;
  }
  .back-link{
    display:inline-flex;
    align-items:center;
    gap:.3rem;
    color:var(--text-dim);
    text-decoration:none;
    font-size:.9rem;
    margin-bottom:.75rem;
  }
  .back-link:hover{ color:var(--accent); }
  header h1{
    margin:0 0 .25rem;
    font-size:1.9rem;
  }
  header p{
    margin:0;
    color:var(--text-dim);
    font-size:1rem;
  }
  main{
    max-width:700px;
    margin:0 auto;
    padding:0 1.5rem 3rem;
  }

  .stats{
    display:flex;
    gap:.75rem;
    margin-bottom:1.5rem;
    flex-wrap:wrap;
  }
  .stat{
    flex:1;
    min-width:120px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    padding:.9rem 1rem;
    text-align:center;
  }
  .stat .num{
    font-size:1.5rem;
    font-weight:700;
  }
  .stat.correct .num{ color:var(--right); }
  .stat.wrong .num{ color:var(--wrong); }
  .stat .lbl{
    font-size:.78rem;
    color:var(--text-dim);
    text-transform:uppercase;
    letter-spacing:.04em;
  }
  #reset-stats{
    display:block;
    margin:-.75rem 0 1.5rem;
    background:none;
    border:none;
    color:var(--text-dim);
    font-size:.8rem;
    text-decoration:underline;
    cursor:pointer;
    padding:0;
  }
  #reset-stats:hover{ color:var(--accent); }

  .quiz-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:16px;
    padding:1.75rem 1.75rem 1.5rem;
  }
  .subject-badge{
    display:inline-block;
    font-size:.78rem;
    font-weight:700;
    padding:.25rem .7rem;
    border-radius:999px;
    margin-bottom:1rem;
  }
  .subject-badge.bio{ background:var(--bio-soft); color:var(--bio); }
  .subject-badge.chem{ background:var(--chem-soft); color:var(--chem); }
  .subject-badge.phys{ background:var(--phys-soft); color:var(--phys); }

  #question{
    font-size:1.25rem;
    font-weight:600;
    line-height:1.4;
    margin:0 0 1.25rem;
  }

  #answer-box{
    background:var(--accent-soft);
    border:1px solid transparent;
    border-radius:10px;
    padding:1rem 1.1rem;
    margin-bottom:1.25rem;
    display:none;
  }
  #answer-box.shown{ display:block; }
  #answer-box .lbl{
    font-size:.75rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:var(--accent);
    margin-bottom:.3rem;
  }
  #answer-text{
    font-size:1.05rem;
    line-height:1.5;
    margin:0;
  }

  .btn-row{
    display:flex;
    gap:.75rem;
    flex-wrap:wrap;
  }
  button{
    font-family:inherit;
    cursor:pointer;
    border-radius:10px;
    font-weight:600;
    font-size:.95rem;
    padding:.75rem 1.2rem;
    border:1px solid transparent;
  }
  button:disabled{
    opacity:.45;
    cursor:default;
  }
  #reveal-btn{
    background:var(--accent);
    color:#fff;
    flex:1;
  }
  #reveal-btn:hover:not(:disabled){ background:#93450a; }

  .mark-row{
    display:none;
    gap:.75rem;
    flex-wrap:wrap;
  }
  .mark-row.shown{ display:flex; }
  #right-btn{
    background:var(--right-soft);
    color:var(--right);
    flex:1;
  }
  #right-btn:hover:not(:disabled){ border-color:var(--right); }
  #right-btn.selected{ background:var(--right); color:#fff; }
  #wrong-btn{
    background:var(--wrong-soft);
    color:var(--wrong);
    flex:1;
  }
  #wrong-btn:hover:not(:disabled){ border-color:var(--wrong); }
  #wrong-btn.selected{ background:var(--wrong); color:#fff; }

  #next-btn{
    display:none;
    background:var(--card);
    color:var(--text);
    border:1px solid var(--border);
    width:100%;
    margin-top:.75rem;
  }
  #next-btn.shown{ display:block; }
  #next-btn:hover{ border-color:var(--accent); color:var(--accent); }
</style>
</head>
<body>

<header>
  <a class="back-link" href="school/science/index.html">&larr; All subjects</a>
  <h1>🎯 Science Hotshot</h1>
  <p>Random quiz questions across Biology, Chemistry &amp; Physics. Have a go, reveal the answer, and mark yourself right or wrong.</p>
</header>

<main>

  <div class="stats">
    <div class="stat correct">
      <div class="num" id="stat-correct">0</div>
      <div class="lbl">Correct</div>
    </div>
    <div class="stat wrong">
      <div class="num" id="stat-wrong">0</div>
      <div class="lbl">Wrong</div>
    </div>
    <div class="stat">
      <div class="num" id="stat-accuracy">&mdash;</div>
      <div class="lbl">Accuracy</div>
    </div>
  </div>
  <button type="button" id="reset-stats">Reset stats</button>

  <div class="quiz-card">
    <span class="subject-badge" id="subject-badge"></span>
    <p id="question"></p>

    <div id="answer-box">
      <div class="lbl">Answer</div>
      <p id="answer-text"></p>
    </div>

    <div class="btn-row">
      <button type="button" id="reveal-btn">Reveal Answer</button>
    </div>

    <div class="mark-row" id="mark-row">
      <button type="button" id="right-btn">✅ Got it right</button>
      <button type="button" id="wrong-btn">❌ Got it wrong</button>
    </div>

    <button type="button" id="next-btn">Next Question &rarr;</button>
  </div>

</main>

<script>
  const QUESTIONS = [
    // Biology
    { s:"bio", q:"What is the function of the nucleus in a cell?", a:"It contains the genetic material (DNA) and controls the cell's activities." },
    { s:"bio", q:"Name two structures found in a plant cell but NOT in an animal cell.", a:"Cell wall and chloroplasts (a permanent vacuole also counts)." },
    { s:"bio", q:"What is the function of mitochondria?", a:"They are the site of (aerobic) respiration, releasing energy for the cell." },
    { s:"bio", q:"What is the main difference between a eukaryotic cell and a prokaryotic cell?", a:"Eukaryotic cells have a nucleus and membrane-bound organelles; prokaryotic cells don't — their DNA is free in the cytoplasm." },
    { s:"bio", q:"Give an example of a prokaryotic organism.", a:"A bacterium." },
    { s:"bio", q:"Roughly how much bigger is a eukaryotic cell than a bacterial cell?", a:"About 10 times bigger (eukaryotic cells are roughly 10-100 micrometres, bacteria around 1 micrometre)." },
    { s:"bio", q:"What process do cells use to divide and produce new body cells for growth and repair?", a:"Mitosis." },
    { s:"bio", q:"What is diffusion?", a:"The net movement of particles from an area of higher concentration to an area of lower concentration." },
    { s:"bio", q:"What is the name for the movement of water across a partially permeable membrane?", a:"Osmosis." },
    { s:"bio", q:"What does it mean for a cell to be 'specialised'?", a:"It has differentiated (changed) to have a structure suited to its particular job." },
    { s:"bio", q:"Give an example of a specialised cell and describe how its structure suits its function.", a:"E.g. a red blood cell — it's a biconcave disc with no nucleus, giving it a large surface area to carry oxygen efficiently." },
    { s:"bio", q:"What is the function of the alveoli in the lungs?", a:"They provide a large surface area for gas exchange between air and blood (oxygen in, carbon dioxide out)." },
    { s:"bio", q:"Name two features that make the alveoli efficient for gas exchange.", a:"Large surface area, thin walls (one cell thick), good blood supply, and a moist lining (any two)." },
    { s:"bio", q:"What is the function of red blood cells?", a:"To carry oxygen around the body, using haemoglobin." },
    { s:"bio", q:"What are the four chambers of the heart called?", a:"Left atrium, right atrium, left ventricle, right ventricle." },
    { s:"bio", q:"What does the digestive enzyme amylase do?", a:"It breaks down starch into sugars (maltose/glucose)." },
    { s:"bio", q:"Where is bile produced, and what is its job?", a:"Produced in the liver (stored in the gall bladder); it emulsifies fats and neutralises stomach acid to help enzymes digest food." },
    { s:"bio", q:"What is the main role of the small intestine?", a:"It absorbs digested food (nutrients) into the blood." },
    { s:"bio", q:"Which hormone controls blood glucose by letting cells take up glucose?", a:"Insulin." },
    { s:"bio", q:"Which gland produces insulin?", a:"The pancreas." },

    // Chemistry
    { s:"chem", q:"What are the three states of matter?", a:"Solid, liquid, and gas." },
    { s:"chem", q:"What happens to the particles in a solid as it's heated until it melts?", a:"They gain energy and vibrate more, until they have enough energy to break free of fixed positions and move past each other — becoming a liquid." },
    { s:"chem", q:"What is an element?", a:"A substance made of only one type of atom." },
    { s:"chem", q:"What is a compound?", a:"A substance made of two or more different elements chemically bonded together." },
    { s:"chem", q:"What is a mixture?", a:"Two or more substances combined together but not chemically bonded, so they can be separated by physical methods." },
    { s:"chem", q:"Which separation method would you use to separate an insoluble solid from a liquid?", a:"Filtration." },
    { s:"chem", q:"Which separation method would you use to get a soluble solid back out of a solution?", a:"Evaporation (or crystallisation)." },
    { s:"chem", q:"What are the rows in the periodic table called?", a:"Periods." },
    { s:"chem", q:"What are the columns in the periodic table called?", a:"Groups." },
    { s:"chem", q:"Whereabouts on the periodic table are most metals found?", a:"On the left and in the middle of the table (non-metals are on the right)." },
    { s:"chem", q:"What is the name given to the Group 0 elements?", a:"The noble gases." },
    { s:"chem", q:"Are noble gases reactive or unreactive, and why?", a:"Unreactive (inert) — they already have a full outer shell of electrons." },
    { s:"chem", q:"What is the name given to the Group 1 elements?", a:"The alkali metals." },
    { s:"chem", q:"What happens to reactivity as you go down Group 1?", a:"Reactivity increases." },
    { s:"chem", q:"What is the smallest part of an element that can still exist?", a:"An atom." },

    // Physics
    { s:"phys", q:"What is the equation linking wave speed, frequency and wavelength?", a:"Wave speed = frequency × wavelength (v = fλ)." },
    { s:"phys", q:"What is frequency measured in?", a:"Hertz (Hz)." },
    { s:"phys", q:"What's the difference between a transverse wave and a longitudinal wave?", a:"In transverse waves the vibrations are at right angles to the direction of energy transfer; in longitudinal waves they're parallel to it." },
    { s:"phys", q:"Give an example of a longitudinal wave.", a:"Sound waves (or the compressions in a slinky spring)." },
    { s:"phys", q:"What is the equation for density?", a:"Density = mass ÷ volume (ρ = m/V)." },
    { s:"phys", q:"What are the units of density?", a:"kg/m³ (or g/cm³)." },
    { s:"phys", q:"An object has a mass of 20 kg and a volume of 4 m³. What is its density?", a:"5 kg/m³ (20 ÷ 4)." },
    { s:"phys", q:"What are the three subatomic particles found in an atom?", a:"Protons, neutrons, and electrons." },
    { s:"phys", q:"Where are protons and neutrons located in an atom?", a:"In the nucleus." },
    { s:"phys", q:"What is the charge of an electron?", a:"Negative (-1)." },
    { s:"phys", q:"What does an element's atomic number tell you?", a:"The number of protons (which equals the number of electrons) in an atom." },
    { s:"phys", q:"What is an isotope?", a:"An atom of the same element with the same number of protons but a different number of neutrons." },
    { s:"phys", q:"What is the equation for speed?", a:"Speed = distance ÷ time." },
    { s:"phys", q:"What are the units of speed, if distance is in metres and time is in seconds?", a:"Metres per second (m/s)." },
    { s:"phys", q:"What is acceleration?", a:"The rate of change of velocity — how quickly speed changes." },
    { s:"phys", q:"What is the equation for acceleration?", a:"Acceleration = change in velocity ÷ time taken (a = Δv/t)." },
    { s:"phys", q:"A car travels 100 metres in 20 seconds. What is its average speed?", a:"5 m/s (100 ÷ 20)." },
  ];

  const SUBJECT_LABELS = { bio:"🧬 Biology", chem:"⚗️ Chemistry", phys:"🌀 Physics" };
  const STATS_KEY = "eric_science_hotshot_stats";

  const subjectBadge = document.getElementById("subject-badge");
  const questionEl = document.getElementById("question");
  const answerBox = document.getElementById("answer-box");
  const answerText = document.getElementById("answer-text");
  const revealBtn = document.getElementById("reveal-btn");
  const markRow = document.getElementById("mark-row");
  const rightBtn = document.getElementById("right-btn");
  const wrongBtn = document.getElementById("wrong-btn");
  const nextBtn = document.getElementById("next-btn");
  const statCorrect = document.getElementById("stat-correct");
  const statWrong = document.getElementById("stat-wrong");
  const statAccuracy = document.getElementById("stat-accuracy");
  const resetStatsBtn = document.getElementById("reset-stats");

  let currentIndex = -1;
  let marked = false;

  function loadStats() {
    try {
      return JSON.parse(localStorage.getItem(STATS_KEY)) || { correct:0, wrong:0 };
    } catch {
      return { correct:0, wrong:0 };
    }
  }

  function saveStats(stats) {
    localStorage.setItem(STATS_KEY, JSON.stringify(stats));
  }

  function renderStats() {
    const stats = loadStats();
    statCorrect.textContent = stats.correct;
    statWrong.textContent = stats.wrong;
    const total = stats.correct + stats.wrong;
    statAccuracy.textContent = total ? `${Math.round((stats.correct / total) * 100)}%` : "—";
  }

  function pickNextIndex() {
    if (QUESTIONS.length === 1) return 0;
    let next;
    do {
      next = Math.floor(Math.random() * QUESTIONS.length);
    } while (next === currentIndex);
    return next;
  }

  function showQuestion() {
    currentIndex = pickNextIndex();
    marked = false;
    const item = QUESTIONS[currentIndex];

    subjectBadge.textContent = SUBJECT_LABELS[item.s];
    subjectBadge.className = `subject-badge ${item.s}`;
    questionEl.textContent = item.q;
    answerText.textContent = item.a;

    answerBox.classList.remove("shown");
    revealBtn.disabled = false;
    markRow.classList.remove("shown");
    nextBtn.classList.remove("shown");
    rightBtn.classList.remove("selected");
    wrongBtn.classList.remove("selected");
    rightBtn.disabled = false;
    wrongBtn.disabled = false;
  }

  revealBtn.addEventListener("click", () => {
    answerBox.classList.add("shown");
    revealBtn.disabled = true;
    markRow.classList.add("shown");
  });

  function mark(isCorrect) {
    if (marked) return;
    marked = true;
    const stats = loadStats();
    if (isCorrect) {
      stats.correct++;
      rightBtn.classList.add("selected");
    } else {
      stats.wrong++;
      wrongBtn.classList.add("selected");
    }
    saveStats(stats);
    renderStats();
    rightBtn.disabled = true;
    wrongBtn.disabled = true;
    nextBtn.classList.add("shown");
  }

  rightBtn.addEventListener("click", () => mark(true));
  wrongBtn.addEventListener("click", () => mark(false));
  nextBtn.addEventListener("click", showQuestion);

  resetStatsBtn.addEventListener("click", () => {
    localStorage.removeItem(STATS_KEY);
    renderStats();
  });

  renderStats();
  showQuestion();
</script>

</body>
</html>
